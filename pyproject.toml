[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "certifi>=2026.10.23",
    "isort>=9.0.2",
    "langchain-google-genai>=4.4.3",
    "langchain-tavily>=0.2.18",
    "langsmith>=0.14.17",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
